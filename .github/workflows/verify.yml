name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-check.txt

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-check.txt

      - name: Run focused verification
        run: make check PYTHON_BIN=python
