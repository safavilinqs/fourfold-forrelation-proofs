name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-check.txt

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-check.txt

      - name: Run focused verification
        run: make check PYTHON_BIN=python

  build-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install document dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science
          python -m pip install numpy matplotlib
      - name: Build proof documents
        run: make build PYTHON_BIN=python
      - name: Save rendered proofs and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-documents
          path: |
            asymptotic_single_pass_floor/main.pdf
            asymptotic_single_pass_floor/main.log
            finite_n4096_certificate/output/pdf/forr4_n4096_advantage.pdf
            finite_n4096_certificate/main.log
            finite_n4096_certificate/figures/passive_certificate.pdf
            finite_n4096_certificate/figures/passive_certificate.svg
